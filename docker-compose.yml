services:
  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    restart: unless-stopped
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY}
      - MATRIX_HOMESERVER=http://conduit:6167
      - MATRIX_BOT_USER=${MATRIX_BOT_USER}
      - MATRIX_BOT_PASSWORD=${MATRIX_BOT_PASSWORD}
      - QDRANT_URL=http://qdrant:6333
      - AGENT_PORT=3001
      - AGENT_DEFAULT_MODEL=${AGENT_DEFAULT_MODEL:-claude-sonnet-4-5-20250929}
      - AGENT_MAX_ACTIONS_PER_MINUTE=${AGENT_MAX_ACTIONS_PER_MINUTE:-30}
      - VAULT_PATH=/data/vault
      - SKILLS_ENCRYPTION_KEY=${SKILLS_ENCRYPTION_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - vault_data:/data/vault
      - skills_data:/data/skills-custom
      - agent_storage:/data
    networks:
      - internal
      - public
    depends_on:
      qdrant:
        condition: service_healthy
      conduit:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    restart: unless-stopped
    environment:
      - GATEWAY_PORT=18789
      - GATEWAY_TOKEN=${GATEWAY_TOKEN}
      - AGENT_API_URL=http://agent:3001
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "18789:18789"
    networks:
      - internal
      - public
    depends_on:
      - agent

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    environment:
      - DASHBOARD_PORT=3000
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN}
      - AGENT_API_URL=http://agent:3001
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - internal
      - public
    depends_on:
      - agent

  conduit:
    image: matrixconduit/matrix-conduit:latest
    restart: unless-stopped
    environment:
      CONDUIT_CONFIG: /etc/conduit.toml
    volumes:
      - ./deploy/conduit/conduit.toml:/etc/conduit.toml:ro
      - conduit_data:/var/lib/matrix-conduit
    networks:
      - internal

  element-web:
    image: vectorim/element-web:latest
    restart: unless-stopped
    volumes:
      - ./deploy/element-web/config.json:/app/config.json:ro
    networks:
      - internal

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_webroot:/var/www/certbot:ro
    networks:
      - internal
      - public
    depends_on:
      - conduit
      - element-web

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    networks:
      - public
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  vault_data:
  skills_data:
  agent_storage:
  conduit_data:
  qdrant_data:
  certbot_webroot:
  certbot_certs:

networks:
  internal:
    driver: bridge
    internal: true
  public:
    driver: bridge
