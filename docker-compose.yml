services:
  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    restart: unless-stopped
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - AGENT_PORT=3001
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-6}
      - AGENT_MAX_ACTIONS_PER_MINUTE=${AGENT_MAX_ACTIONS_PER_MINUTE:-30}
      - AGENT_API_TOKEN=${AGENT_API_TOKEN}
      - VAULT_PATH=/data/vault
      - DB_PATH=/data/conversations.db
      - SKILLS_ENCRYPTION_KEY=${SKILLS_ENCRYPTION_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # OAuth configuration
      - OAUTH_REDIRECT_DOMAIN=${OAUTH_REDIRECT_DOMAIN:-}
      # Model provider configuration
      - MODEL_PROVIDER=${MODEL_PROVIDER:-claude}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:latest}
      # --- Multi-agent swarm tuning (Jonas/Sonnet, Gandalf/Opus, Lucy/Haiku) ---
      # Opus needs longer model turns; 3min accommodates deep reasoning
      - AGENT_MODEL_TURN_TIMEOUT_MS_CLAUDE=${AGENT_MODEL_TURN_TIMEOUT_MS_CLAUDE:-180000}
      # Let agents chain more tools per turn (Opus benefits most)
      - AGENT_TOOL_MAX_TURNS=${AGENT_TOOL_MAX_TURNS:-6}
      - AGENT_TOOL_MAX_REPEAT=${AGENT_TOOL_MAX_REPEAT:-3}
      - AGENT_TOOL_TIMEOUT_MS=${AGENT_TOOL_TIMEOUT_MS:-20000}
      # More concurrent jobs — Haiku is cheap, Sonnet delegations overlap
      - AGENT_MAX_CONCURRENT_JOBS=${AGENT_MAX_CONCURRENT_JOBS:-8}
      # 3-tier delegation: Jonas(Sonnet) → Gandalf(Opus) → Lucy(Haiku)
      - AGENT_MAX_DELEGATION_DEPTH=${AGENT_MAX_DELEGATION_DEPTH:-3}
      # Richer context for Opus; acceptable overhead for Haiku
      - AGENT_MAX_TOOL_RESULT_CHARS=${AGENT_MAX_TOOL_RESULT_CHARS:-6000}
      - AGENT_MAX_HISTORY_MSG_CHARS=${AGENT_MAX_HISTORY_MSG_CHARS:-1500}
      # Job system (delegation routes here now)
      - AGENT_JOB_TIMEOUT_MS=${AGENT_JOB_TIMEOUT_MS:-600000}
      - AGENT_JOB_HISTORY_SIZE=${AGENT_JOB_HISTORY_SIZE:-200}
    volumes:
      - ./.volumes/agent-data:/data
      # Optional: mount host Claude Code skills dir for bidirectional sync
      # Uncomment and set CLAUDE_SKILLS_PATH=/claude-skills in your .env to enable
      # - ${HOME}/.claude/skills:/claude-skills:rw
    networks:
      - internal
      - public
    depends_on:
      qdrant:
        condition: service_healthy
      # Uncomment to require Ollama service
      # ollama:
      #   condition: service_started

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    restart: unless-stopped
    environment:
      - GATEWAY_PORT=18789
      - GATEWAY_TOKEN=${GATEWAY_TOKEN}
      - AGENT_API_URL=http://agent:3001
      - AGENT_API_TOKEN=${AGENT_API_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "18789:18789"
    networks:
      - internal
      - public
    depends_on:
      - agent

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    environment:
      - DASHBOARD_PORT=3000
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN}
      - AGENT_API_URL=http://agent:3001
      - AGENT_API_TOKEN=${AGENT_API_TOKEN}
      - OAUTH_REDIRECT_DOMAIN=${OAUTH_REDIRECT_DOMAIN:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DOMAIN=${DOMAIN:-localhost}
      - DASHBOARD_COOKIE_SECURE=${DASHBOARD_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - internal
      - public
    depends_on:
      - agent

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - ./.volumes/qdrant:/qdrant/storage
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Ollama - Local LLM inference (optional)
  # Uncomment this service to run local models
  # ollama:
  #   image: ollama/ollama:latest
  #   restart: unless-stopped
  #   volumes:
  #     - ./.volumes/ollama:/root/.ollama
  #   networks:
  #     - internal
  #   healthcheck:
  #     test: ["CMD", "ollama", "list"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  #   # Uncomment for GPU support (NVIDIA)
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: all
  #   #           capabilities: [gpu]

networks:
  internal:
    driver: bridge
    internal: true
  public:
    driver: bridge
