services:
  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    restart: unless-stopped
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - AGENT_PORT=3001
      - AGENT_DEFAULT_MODEL=${AGENT_DEFAULT_MODEL:-claude-sonnet-4-5-20250929}
      - AGENT_MAX_ACTIONS_PER_MINUTE=${AGENT_MAX_ACTIONS_PER_MINUTE:-30}
      - VAULT_PATH=/data/vault
      - SKILLS_ENCRYPTION_KEY=${SKILLS_ENCRYPTION_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./.volumes/agent-data:/data
    networks:
      - internal
      - public
    depends_on:
      qdrant:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    restart: unless-stopped
    environment:
      - GATEWAY_PORT=18789
      - GATEWAY_TOKEN=${GATEWAY_TOKEN}
      - AGENT_API_URL=http://agent:3001
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "18789:18789"
    networks:
      - internal
      - public
    depends_on:
      - agent

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    environment:
      - DASHBOARD_PORT=3000
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN}
      - AGENT_API_URL=http://agent:3001
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - internal
      - public
    depends_on:
      - agent

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - ./.volumes/qdrant:/qdrant/storage
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  internal:
    driver: bridge
    internal: true
  public:
    driver: bridge
